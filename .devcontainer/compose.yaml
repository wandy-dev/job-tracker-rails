name: "job_tracker"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
    - ../../job-tracker:/workspaces/job-tracker:cached
    
    working_dir: /workspaces/job-tracker
    ports:
      - "3000:3000"

    # Boot the Rails server instead of sleeping
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bin/rails server -b 0.0.0.0"

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode
    depends_on:
    - selenium

  selenium:
    image: selenium/standalone-chromium
    restart: unless-stopped

  
